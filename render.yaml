services:
  - type: web
    name: vinnpro-campus-os
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/campus.db
    disk:
      name: vinnpro-campus-data
      mountPath: /var/data
      sizeGB: 1
